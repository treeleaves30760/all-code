name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            os: linux
            helper_arch: amd64
            archive: alc-linux-x86_64.tar.gz
            cross: true
          - runner: ubuntu-latest
            target: aarch64-unknown-linux-musl
            os: linux
            helper_arch: arm64
            archive: alc-linux-aarch64.tar.gz
            cross: true
          - runner: macos-13
            target: x86_64-apple-darwin
            os: darwin
            helper_arch: amd64
            archive: alc-darwin-x86_64.tar.gz
            cross: false
          - runner: macos-14
            target: aarch64-apple-darwin
            os: darwin
            helper_arch: arm64
            archive: alc-darwin-aarch64.tar.gz
            cross: false
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            os: windows
            helper_arch: amd64
            archive: alc-windows-x86_64.zip
            cross: false
          - runner: windows-latest
            target: aarch64-pc-windows-msvc
            os: windows
            helper_arch: arm64
            archive: alc-windows-aarch64.zip
            cross: false
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - name: Build native binary
        if: ${{ !matrix.cross }}
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Cross-compile Linux
        if: ${{ matrix.cross }}
        uses: houseabsolute/actions-rust-cross@v1
        with:
          command: build
          target: ${{ matrix.target }}
          args: '--locked --release'
      - name: Bundle alc and pinned helper
        shell: pwsh
        run: >-
          ./scripts/package-release.ps1
          -Target '${{ matrix.target }}'
          -Os '${{ matrix.os }}'
          -HelperArch '${{ matrix.helper_arch }}'
          -ArchiveName '${{ matrix.archive }}'
      - uses: actions/upload-artifact@v7
        with:
          name: package-${{ matrix.target }}
          path: dist/${{ matrix.archive }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: package-*
          path: dist
          merge-multiple: true
      - name: Generate SHA-256 checksums
        shell: pwsh
        run: ./scripts/write-checksums.ps1 -Directory ./dist
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
