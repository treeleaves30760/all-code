name: Weekly compatibility

on:
  schedule:
    - cron: '0 19 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  latest-codex-catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - name: Install latest Codex CLI
        run: npm install --global @openai/codex@latest
      - name: Verify live Luna, Terra, and Sol catalog
        run: cargo run --locked -- models --refresh --json
      - name: Run tests against current dependencies
        run: cargo test --locked --all-targets --all-features

  pinned-helper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify the linked bridge is still current
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The bridge is a Cargo dependency now, so the tag in Cargo.toml is
          # the pin that matters; the constant in launch.rs only reports it.
          $manifest = Get-Content -Raw ./Cargo.toml
          # alc builds against its own fork now, pinned by commit, so what
          # matters is whether upstream has moved past what the fork carries.
          if ($manifest -notmatch 'claude-code-with-codex", rev = "([0-9a-f]{40})"') {
            throw 'Could not read the pinned bridge commit from Cargo.toml'
          }
          $pinned = $Matches[1]
          Write-Host "alc pins the fork at $pinned"
          $latest = (gh api repos/fcakyon/claude-code-with-codex/releases/latest --jq .tag_name)
          $reported = (Get-Content -Raw ./src/launch.rs)
          if ($reported -notmatch 'CLAUDE_CODEX_BRIDGE_VERSION: &str = "([^"]+)"') {
            throw 'Could not read the reported bridge version from src/launch.rs'
          }
          if ("v$($Matches[1])" -ne $latest) {
            throw "upstream claude-codex $latest is out; alc's fork is based on v$($Matches[1])"
          }
          Write-Host "the fork is based on the current upstream $latest"
