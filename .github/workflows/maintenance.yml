name: Weekly compatibility

on:
  schedule:
    - cron: '0 19 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  latest-codex-catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - name: Install latest Codex CLI
        run: npm install --global @openai/codex@latest
      - name: Verify live Luna, Terra, and Sol catalog
        run: cargo run --locked -- models --refresh --json
      - name: Run tests against current dependencies
        run: cargo test --locked --all-targets --all-features

  pinned-helper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check whether Codex offers a model alc's catalog does not
        shell: pwsh
        run: |
          # alc owns the bridge now, so there is no pinned dependency to watch.
          # What can still drift is the model catalog: Codex ships a slug and
          # alc's TARGET_MODELS has not heard of it.
          $source = Get-Content -Raw ./src/model_catalog.rs
          if ($source -notmatch '(?s)TARGET_MODELS[^\]]+\]') {
            throw 'Could not read TARGET_MODELS from src/model_catalog.rs'
          }
          Write-Host "alc offers:"
          [regex]::Matches($Matches[0], '"([^"]+)"') | ForEach-Object { "  $($_.Groups[1].Value)" }
          Write-Host 'Compare against `codex debug models` when Codex ships a release.'
