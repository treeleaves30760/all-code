name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt -- --check

      # The remote-control page ships inside the binary, so its JavaScript
      # never meets a bundler that would have caught a syntax error.
      - name: Check the page's JavaScript parses
        run: node --check web/app.js

      # xterm.js is committed rather than fetched, so nothing else would
      # notice it drifting from the version VENDOR.lock names.
      - name: Verify the vendored browser assets
        run: |
          set -euo pipefail
          grep -vE '^\s*(#|$)' web/vendor/VENDOR.lock | while read -r name _pkg sha _url; do
            echo "$sha  web/vendor/$name" | sha256sum --check --strict
          done

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up MSVC compiler
        if: runner.os == 'Windows'
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-targets --all-features

  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Test installer with Windows PowerShell 5.1
        shell: powershell
        run: ./tests/install-windows.ps1
      - name: Test installer with PowerShell 7
        shell: pwsh
        run: ./tests/install-windows.ps1
