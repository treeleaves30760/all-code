name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt -- --check

      # The remote-control page ships inside the binary, so its JavaScript
      # never meets a bundler that would have caught a syntax error.
      - name: Check the page's JavaScript parses
        run: |
          node --check web/app.js
          node --check web/core.js

      # Everything the page decides lives in core.js precisely so it can be
      # tested without a browser.
      - name: Test the page's logic
        run: node --test 'web/*.test.js'

      # xterm.js is committed rather than fetched, so nothing else would
      # notice it drifting from the version VENDOR.lock names.
      - name: Verify the vendored browser assets
        run: |
          set -euo pipefail
          grep -vE '^\s*(#|$)' web/vendor/VENDOR.lock | while read -r name _pkg sha _url; do
            echo "$sha  web/vendor/$name" | sha256sum --check --strict
          done

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up MSVC compiler
        if: runner.os == 'Windows'
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Link a distinct same-version host generation
        if: runner.os != 'Windows'
        shell: bash
        run: |
          fixture_dir="$(mktemp -d "${RUNNER_TEMP}/alc-host-generation.XXXXXX")"
          cargo rustc --locked --bin alc -- -C metadata=alc-host-generation-fixture
          cp target/debug/alc "$fixture_dir/alc"
          cargo build --locked
          printf 'ALC_TEST_OTHER_BINARY=%s\n' "$fixture_dir/alc" >> "$GITHUB_ENV"
      - run: cargo test --all-targets --all-features

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: '1.88'
      - run: cargo check --locked --all-targets --all-features

  unix-installer:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Check shell syntax
        run: sh -n install.sh && sh -n tests/install-unix.sh
      - name: Test installer offline (including sudo terminal handling)
        run: sh tests/install-unix.sh

  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      # Test this PR's verified payload, not an older latest release whose
      # executable does not implement the immutable installation transaction.
      - name: Build the local Windows installer payload
        run: cargo build --locked
      - name: Package a local installer fixture
        shell: pwsh
        run: |
          $fixture = Join-Path $env:RUNNER_TEMP ('alc-release-test-' + [guid]::NewGuid().ToString('N'))
          $stage = Join-Path $fixture 'stage'
          New-Item -ItemType Directory -Path $stage | Out-Null
          Copy-Item -LiteralPath 'target/debug/alc.exe' -Destination $stage
          Copy-Item -LiteralPath 'LICENSE', 'THIRD_PARTY.md' -Destination $stage
          Copy-Item -LiteralPath 'THIRD_PARTY_LICENSES' -Destination $stage -Recurse
          $asset = 'alc-windows-x86_64.zip'
          $archive = Join-Path $fixture $asset
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $archive
          $digest = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText((Join-Path $fixture 'checksums.txt'), "$digest  $asset`n", [Text.UTF8Encoding]::new($false))
          "ALC_TEST_RELEASE_DIR=$fixture" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Test tmux setup offline with Windows PowerShell 5.1
        shell: powershell
        run: ./tests/install-tmux-windows.ps1
      - name: Test tmux setup offline with PowerShell 7
        shell: pwsh
        run: ./tests/install-tmux-windows.ps1
      - name: Test installer with Windows PowerShell 5.1
        shell: powershell
        run: ./tests/install-windows.ps1
      - name: Test installer with PowerShell 7
        shell: pwsh
        run: ./tests/install-windows.ps1
