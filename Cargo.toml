[package]
name = "all-code"
version = "0.1.0"
edition = "2024"
description = "One CLI to configure and launch Claude Code, Codex, and OpenCode with multiple LLM providers"
license = "MIT"
repository = "https://github.com/treeleaves30760/all-code"
readme = "README.md"
keywords = ["llm", "claude-code", "codex", "opencode", "tui"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "alc"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
crossterm = "0.28"
ratatui = "0.29"
rpassword = "7.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
which = "7.0"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.14"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
