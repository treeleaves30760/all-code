[package]
name = "all-code"
version = "1.5.0"
edition = "2024"
rust-version = "1.88"
description = "One CLI to configure and launch Claude Code, Codex, OpenCode, Pi, Copilot CLI, Goose, Qwen Code, and Kimi Code CLI with multiple LLM providers"
license = "MIT"
repository = "https://github.com/treeleaves30760/all-code"
homepage = "https://treeleaves30760.github.io/all-code/"
documentation = "https://treeleaves30760.github.io/all-code/"
readme = "README.md"
keywords = ["llm", "claude-code", "codex", "opencode", "coding-agent"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "alc"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
avt = "0.18"
# src/bridge only. Versions match what the vendored bridge already pulled in,
# so adding them as direct dependencies costs no new crates.
axum = "0.8"
base64 = "0.22"
bytes = "1"
# The Codex bridge, run in-process rather than shelled out to. alc no longer
# ships or downloads a second binary, and the two halves can no longer drift
# out of step.
#
clap = { version = "4.5", features = ["derive", "env"] }
crossterm = "0.29"
flate2 = "1.1"
futures-util = "0.3"
getrandom = "0.4"
portable-pty = "0.9"
ratatui = "0.30"
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "stream",
    "rustls-tls",
] }
rpassword = "7.4"
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
tar = "0.4"
tempfile = "3.14"
# Only what the bridge's own server needs; alc itself stays synchronous.
# `sync` and `time` are src/bridge's: a single-flighted token refresh and a
# stream idle timeout.
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time"] }
toml = "1.1"
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
ureq = "3.4"
which = "8.0"
zip = { version = "8.6", default-features = false, features = ["deflate"] }

[build-dependencies]
flate2 = "1.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
# Exercises the bridge router without binding a port.
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
