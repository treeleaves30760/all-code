[package]
name = "all-code"
version = "1.1.0"
edition = "2024"
description = "One CLI to configure and launch Claude Code, Codex, OpenCode, Pi, Copilot CLI, Goose, Qwen Code, and Kimi Code CLI with multiple LLM providers"
license = "MIT"
repository = "https://github.com/treeleaves30760/all-code"
homepage = "https://treeleaves30760.github.io/all-code/"
documentation = "https://treeleaves30760.github.io/all-code/"
readme = "README.md"
keywords = ["llm", "claude-code", "codex", "opencode", "coding-agent"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "alc"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
crossterm = "0.28"
flate2 = "1.1"
ratatui = "0.30"
rpassword = "7.4"
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
tar = "0.4"
tempfile = "3.14"
toml = "1.1"
ureq = "3.4"
which = "8.0"
zip = { version = "8.6", default-features = false, features = ["deflate"] }

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
