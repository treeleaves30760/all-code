# Curated offline subset of LiteLLM commit 33d908e0ae2c0a257eeb5d546df08527d348a670.
# Rates are decimal USD per million tokens, cross-checked against first-party docs.
# Missing models, tiers, rates and context bands are deliberately not inferred.
