<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="referrer" content="no-referrer" />
    <meta name="color-scheme" content="light dark" />
    <title>alc</title>
    <link rel="stylesheet" href="/assets/xterm.css" />
    <link rel="stylesheet" href="/assets/app.css" />
  </head>
  <body>
    <header id="bar">
      <button id="back" class="icon" hidden>&#8592;</button>
      <div id="title">
        <strong data-i18n="appName">alc</strong>
        <span id="subtitle"></span>
      </div>
      <span id="grade" class="pill" hidden></span>
      <span id="link" class="pill" hidden></span>
    </header>

    <main>
      <section id="list">
        <p id="empty" class="empty" data-i18n="noSessions"></p>
        <ul id="sessions"></ul>
        <p class="hint" data-i18n="listHint"></p>
      </section>

      <section id="view" hidden>
        <div id="perm" class="perm" hidden>
          <span id="permLabel" class="perm-label"></span>
          <select id="permPick" aria-label="permission"></select>
          <button type="button" id="permCycle" hidden></button>
          <span id="permNote" class="perm-note"></span>
        </div>
        <div id="terminal"></div>
        <div id="keys" class="keys"></div>
        <form id="composer">
          <textarea
            id="compose"
            rows="1"
            autocapitalize="off"
            autocomplete="off"
            autocorrect="off"
            spellcheck="false"
          ></textarea>
          <button type="submit" id="send" data-i18n="send"></button>
        </form>
      </section>
    </main>

    <div id="toast" role="status" aria-live="polite" hidden></div>

    <script src="/assets/xterm.js"></script>
    <script src="/assets/addon-fit.js"></script>
    <script src="/assets/app.js"></script>
  </body>
</html>
