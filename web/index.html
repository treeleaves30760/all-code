<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="referrer" content="no-referrer" />
    <meta name="color-scheme" content="light dark" />
    <title>alc</title>
    <!-- Inline, so the browser's automatic /favicon.ico request never
         happens: that route needs a token, and every page load was logging
         a 401 for it. `img-src 'self' data:` in the CSP allows this. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='1' y='1' width='14' height='14' rx='4' fill='%236366f1'/%3E%3Cpath d='M4.5 5.5 7 8l-2.5 2.5M8.5 11h3' stroke='white' stroke-width='1.5' fill='none' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="/assets/xterm.css" />
    <link rel="stylesheet" href="/assets/app.css" />
  </head>
  <body data-pane="list">
    <!-- Behind everything: a background the page or a mod draws, and the
         veil of the page's own colour over it. layout.js fills it. -->
    <div id="backdrop" aria-hidden="true">
      <div id="backdropArt"></div>
      <div id="backdropDim"></div>
    </div>
    <!-- One sprite for every icon on the page, referenced by <use>. Inline so
         it costs no request and no round trip against a route that needs a
         token, and drawn in `currentColor` so one set serves both themes and
         whatever state colour the thing it sits in happens to carry.

         An icon never carries a meaning on its own here: each one sits beside
         its own word, or on a control that already has an accessible name.
         The safety facts on this page are the last place to ask someone to
         learn a glyph vocabulary. -->
    <svg id="icons" aria-hidden="true" hidden>
      <symbol id="i-back" viewBox="0 0 16 16">
        <path d="M9.5 3.5 5 8l4.5 4.5" />
      </symbol>
      <symbol id="i-rail" viewBox="0 0 16 16">
        <rect x="2.25" y="2.75" width="11.5" height="10.5" rx="1.6" />
        <path d="M6.25 2.75v10.5" />
      </symbol>
      <symbol id="i-usage" viewBox="0 0 16 16">
        <path d="M2.4 12.2a6.4 6.4 0 1 1 11.2 0" />
        <path d="M8 9.6 10.9 6" />
      </symbol>
      <symbol id="i-copy" viewBox="0 0 16 16">
        <rect x="6" y="6" width="7.5" height="7.5" rx="1.6" />
        <path d="M10.4 3.6H4a1.6 1.6 0 0 0-1.6 1.6v6.4" />
      </symbol>
      <symbol id="i-fit" viewBox="0 0 16 16">
        <path d="M2.5 6V2.5H6M10 2.5h3.5V6M13.5 10v3.5H10M6 13.5H2.5V10" />
        <path d="M5.5 5.5l2 2M10.5 5.5l-2 2M5.5 10.5l2-2M10.5 10.5l-2-2" />
      </symbol>
      <symbol id="i-window" viewBox="0 0 16 16">
        <rect x="2" y="2.75" width="12" height="10.5" rx="1.6" />
        <path d="M2 5.75h12" />
        <path d="M4 4.25h.01M5.75 4.25h.01" />
      </symbol>
      <symbol id="i-layers" viewBox="0 0 16 16">
        <path d="M8 2.25 14 5.5 8 8.75 2 5.5z" />
        <path d="M2 8.25 8 11.5l6-3.25" />
        <path d="M2 11 8 14.25 14 11" />
      </symbol>
      <symbol id="i-image" viewBox="0 0 16 16">
        <rect x="2" y="2.75" width="12" height="10.5" rx="1.6" />
        <circle cx="5.75" cy="6.25" r="1.1" />
        <path d="m2.5 12 3.75-3.5 2.5 2.25 2-1.75 2.75 2.5" />
      </symbol>
      <symbol id="i-plus" viewBox="0 0 16 16">
        <path d="M8 3v10M3 8h10" />
      </symbol>
      <symbol id="i-files" viewBox="0 0 16 16">
        <rect x="2.25" y="2.75" width="11.5" height="10.5" rx="1.6" />
        <path d="M9.75 2.75v10.5" />
        <path d="M11 5.5h1.25M11 7.75h1.25" />
      </symbol>
      <symbol id="i-folder" viewBox="0 0 16 16">
        <path d="M1.9 4.6c0-.8.6-1.4 1.4-1.4h2.6l1.5 1.6h5.3c.8 0 1.4.6 1.4 1.4v5.6c0 .8-.6 1.4-1.4 1.4H3.3c-.8 0-1.4-.6-1.4-1.4z" />
      </symbol>
      <symbol id="i-file" viewBox="0 0 16 16">
        <path d="M4.2 1.9h4.9l3 3v8.2c0 .6-.4 1-1 1H4.2c-.6 0-1-.4-1-1V2.9c0-.6.4-1 1-1z" />
        <path d="M9 1.9v3.2h3.1" />
      </symbol>
      <symbol id="i-link" viewBox="0 0 16 16">
        <path d="M6.6 9.4 9.4 6.6" />
        <path d="M7.4 4.6 8.6 3.4a2.5 2.5 0 0 1 3.5 3.5l-1.2 1.2M8.6 11.4l-1.2 1.2a2.5 2.5 0 0 1-3.5-3.5l1.2-1.2" />
      </symbol>
      <symbol id="i-up" viewBox="0 0 16 16">
        <path d="M8 12.5v-9M4 7.5l4-4 4 4" />
      </symbol>
      <symbol id="i-reload" viewBox="0 0 16 16">
        <path d="M13 8a5 5 0 1 1-1.5-3.55" />
        <path d="M13 2.75v2.5h-2.5" />
      </symbol>
      <symbol id="i-close" viewBox="0 0 16 16">
        <path d="m4 4 8 8M12 4l-8 8" />
      </symbol>
      <symbol id="i-search" viewBox="0 0 16 16">
        <circle cx="7" cy="7" r="4.25" />
        <path d="m10.2 10.2 3.3 3.3" />
      </symbol>
      <symbol id="i-eye" viewBox="0 0 16 16">
        <path d="M1.75 8S4 3.75 8 3.75 14.25 8 14.25 8 12 12.25 8 12.25 1.75 8 1.75 8z" />
        <circle cx="8" cy="8" r="1.9" />
      </symbol>
      <symbol id="i-settings" viewBox="0 0 16 16">
        <circle cx="8" cy="8" r="2.1" />
        <path d="M8 1.75v1.6M8 12.65v1.6M14.25 8h-1.6M3.35 8h-1.6M12.42 3.58l-1.13 1.13M4.71 11.29l-1.13 1.13M12.42 12.42l-1.13-1.13M4.71 4.71 3.58 3.58" />
      </symbol>
      <symbol id="i-sessions" viewBox="0 0 16 16">
        <rect x="2" y="2.75" width="12" height="10.5" rx="1.8" />
        <path d="m4.75 6.25 1.75 1.5-1.75 1.5M8 9.75h3" />
      </symbol>
      <symbol id="i-command" viewBox="0 0 16 16">
        <path d="M5.5 5.5h5v5h-5z" />
        <path d="M5.5 5.5V4a1.5 1.5 0 1 0-1.5 1.5zM10.5 5.5V4A1.5 1.5 0 1 1 12 5.5zM5.5 10.5V12A1.5 1.5 0 1 1 4 10.5zM10.5 10.5V12a1.5 1.5 0 1 0 1.5-1.5z" />
      </symbol>
      <symbol id="i-puzzle" viewBox="0 0 16 16">
        <path d="M3 5.25h2.4a1.6 1.6 0 1 1 3.2 0H11v2.4a1.6 1.6 0 1 1 0 3.2v2.4H8.6a1.6 1.6 0 1 0-3.2 0H3z" />
      </symbol>
      <symbol id="i-spark" viewBox="0 0 16 16">
        <path d="M8 2v3M8 11v3M2 8h3M11 8h3M4.2 4.2l1.6 1.6M10.2 10.2l1.6 1.6M11.8 4.2l-1.6 1.6M5.8 10.2l-1.6 1.6" />
      </symbol>
      <symbol id="i-note" viewBox="0 0 16 16">
        <path d="M3.5 2.25h9v11.5h-9z" />
        <path d="M5.75 5.25h4.5M5.75 7.75h4.5M5.75 10.25h2.5" />
      </symbol>
      <symbol id="i-bolt" viewBox="0 0 16 16">
        <path d="M9 1.75 3.75 9H8l-1 5.25L12.25 7H8z" />
      </symbol>
      <symbol id="i-more" viewBox="0 0 16 16">
        <circle cx="3.5" cy="8" r="1.1" />
        <circle cx="8" cy="8" r="1.1" />
        <circle cx="12.5" cy="8" r="1.1" />
      </symbol>
      <symbol id="i-grid" viewBox="0 0 16 16">
        <rect x="2.25" y="2.25" width="4.75" height="4.75" rx="1" />
        <rect x="9" y="2.25" width="4.75" height="4.75" rx="1" />
        <rect x="2.25" y="9" width="4.75" height="4.75" rx="1" />
        <rect x="9" y="9" width="4.75" height="4.75" rx="1" />
      </symbol>
      <symbol id="i-chart" viewBox="0 0 16 16">
        <path d="M2.25 13.75h11.5" />
        <path d="M4.25 11V8M7.25 11V4.5M10.25 11V6.5M13 11V9" />
      </symbol>
      <symbol id="i-clock" viewBox="0 0 16 16">
        <circle cx="8" cy="8" r="5.75" />
        <path d="M8 4.75V8l2.25 1.5" />
      </symbol>
      <symbol id="i-star" viewBox="0 0 16 16">
        <path d="m8 2 1.8 3.8 4.2.5-3.1 2.9.8 4.1L8 11.3l-3.7 2 .8-4.1L2 6.3l4.2-.5z" />
      </symbol>
      <symbol id="i-terminal" viewBox="0 0 16 16">
        <path d="m3.5 4.5 3 3.5-3 3.5M8.5 11.5h4" />
      </symbol>
      <symbol id="i-check" viewBox="0 0 16 16">
        <path d="m3.5 8.5 3 3 6-7" />
      </symbol>
      <symbol id="i-palette" viewBox="0 0 16 16">
        <path d="M8 1.9a6.1 6.1 0 1 0 0 12.2c1 0 1.4-.6 1.4-1.3 0-.9-.8-1.2-.8-2 0-.7.6-1.2 1.3-1.2h1.6c1.6 0 2.6-1.1 2.6-2.6C14.1 4.4 11.4 1.9 8 1.9z" />
        <circle cx="5" cy="7.5" r=".6" />
        <circle cx="6.7" cy="4.9" r=".6" />
        <circle cx="9.7" cy="4.9" r=".6" />
      </symbol>
      <symbol id="i-ungated" viewBox="0 0 16 16">
        <path d="M8 1.9 13 4.1v3.7c0 3-2.1 5.4-5 6.3-2.9-.9-5-3.3-5-6.3V4.1z" />
        <path d="M5.4 10.6 10.6 5.4" />
      </symbol>
    </svg>

    <header id="bar">
      <button id="back" class="icon" type="button" hidden aria-label="Back">
        <svg class="glyph" aria-hidden="true"><use href="#i-back" /></svg>
      </button>

      <!-- Folds the session list away so the terminal gets its width. Drawn
           only on a wide screen with a session open, the one place a list
           sits beside a terminal; app.css decides that, not this file. -->
      <button id="railToggle" class="icon" type="button" aria-controls="list" aria-expanded="true">
        <svg class="glyph" aria-hidden="true"><use href="#i-rail" /></svg>
      </button>

      <div id="title">
        <strong>alc</strong>
        <span id="subtitle"></span>
      </div>

      <!-- The page's places: sessions, usage, settings, and any tab a mod
           adds. In the header on a wide screen, a bottom bar on a phone;
           app.css moves it, shell.js fills it. -->
      <nav id="nav" class="nav"></nav>

      <span class="bar-spacer"></span>

      <!-- Widgets a mod or layout put in the header. -->
      <div id="barSlot" class="slot slot-bar"></div>

      <!-- Floating windows that are closed, to open again. -->
      <div id="winTray" class="win-tray" hidden></div>

      <!-- Connection state is a light, not a sentence. It is always on
           screen while attached, so it cannot be missed the way a toast
           that has already faded can. -->
      <span id="link" class="status" hidden>
        <span class="status-dot" aria-hidden="true"></span>
        <span id="linkLabel"></span>
      </span>
      <span id="grade" class="pill" hidden></span>

      <!-- The file panel's switch. Only beside an open session, and only
           for a link that can type: the panel is operator-only. -->
      <!-- A plain session's size belongs to the terminal that started it;
           this lets the page take it, so the terminal fills the page. -->
      <button id="fitToggle" class="icon" type="button" aria-pressed="false" hidden>
        <svg class="glyph" aria-hidden="true"><use href="#i-fit" /></svg>
      </button>

      <button id="filesToggle" class="icon" type="button" aria-controls="files" aria-expanded="false" hidden>
        <svg class="glyph" aria-hidden="true"><use href="#i-files" /></svg>
      </button>

      <!-- Every action on the page, and every mod's, behind one search box. -->
      <button id="paletteToggle" class="icon palette-toggle" type="button" aria-haspopup="dialog">
        <svg class="glyph" aria-hidden="true"><use href="#i-search" /></svg>
        <kbd class="kbd" aria-hidden="true"></kbd>
      </button>
    </header>

    <main>
      <section id="list" aria-label="Sessions">
        <div class="list-head">
          <h2 id="sessionsTitle" class="pane-title"></h2>
          <span id="sessionsCount" class="count"></span>
        </div>
        <div id="listTop" class="slot slot-list"></div>
        <label class="filter" id="filterBox" hidden>
          <svg class="glyph" aria-hidden="true"><use href="#i-search" /></svg>
          <input id="filter" type="search" autocomplete="off" spellcheck="false" />
        </label>
        <ul id="sessions"></ul>
        <p id="noMatch" class="note no-match" hidden></p>
        <div id="listBottom" class="slot slot-list"></div>

        <!-- Shown only when there is nothing to list. The command is the
             whole message: there is no session because none was started. -->
        <div id="empty" class="empty" hidden>
          <span class="empty-mark" aria-hidden="true"></span>
          <p id="emptyTitle" class="empty-title"></p>
          <p id="emptyHow" class="empty-how"></p>
          <button type="button" id="emptyCommand" class="command">
            <svg class="glyph" aria-hidden="true"><use href="#i-copy" /></svg>
            <span class="command-text"></span>
          </button>
        </div>
      </section>

      <!-- What is left on each login, and where it went. Read-only: this
           page can spend a quota but never change one. -->
      <section id="usage" aria-label="Usage">
        <div class="page-head">
          <div>
            <h1 id="usageHeading" class="page-title"></h1>
            <p id="usageSub" class="page-sub"></p>
          </div>
          <div id="rangePick" class="segmented" role="radiogroup"></div>
        </div>

        <!-- The history: what was spent and when, drawn by dashboard.js
             from /api/usage/history. -->
        <div id="stats" class="stats"></div>
        <div class="dash-grid">
          <article class="panel chart-panel">
            <header class="panel-head">
              <h2 id="dailyTitle" class="panel-title"></h2>
              <div id="metricPick" class="segmented small" role="radiogroup"></div>
            </header>
            <div id="legend" class="legend"></div>
            <div id="daily" class="chart"></div>
          </article>
          <article class="panel">
            <header class="panel-head">
              <h2 id="hoursTitle" class="panel-title"></h2>
            </header>
            <div id="hours" class="hours"></div>
            <p id="hoursNote" class="panel-note"></p>
          </article>
          <article class="panel">
            <header class="panel-head"><h2 id="modelsTitle" class="panel-title"></h2></header>
            <ol id="models" class="bars"></ol>
          </article>
          <article class="panel">
            <header class="panel-head"><h2 id="agentsTitle" class="panel-title"></h2></header>
            <ol id="agentBars" class="bars"></ol>
            <header class="panel-head sub"><h2 id="providersTitle" class="panel-title"></h2></header>
            <ol id="providerBars" class="bars"></ol>
          </article>
        </div>
        <p id="historyNote" class="note history-note" hidden></p>

        <h2 id="accountsTitle" class="pane-title"></h2>
        <ul id="accounts"></ul>
        <p id="usageNote" class="note" hidden></p>

        <div id="usageEmpty" class="empty" hidden>
          <span class="empty-mark" aria-hidden="true"></span>
          <p id="usageEmptyTitle" class="empty-title"></p>
          <p id="usageEmptyHow" class="empty-how"></p>
          <button type="button" id="usageEmptyCommand" class="command">
            <svg class="glyph" aria-hidden="true"><use href="#i-copy" /></svg>
            <span class="command-text"></span>
          </button>
        </div>

        <h2 id="ledgerTitle" class="pane-title"></h2>
        <table id="ledger" class="ledger">
          <thead>
            <tr>
              <th id="ledgerProvider"></th>
              <th id="ledgerAgent"></th>
              <th id="ledgerLaunches"></th>
              <th id="ledgerTurns"></th>
              <th id="ledgerInput"></th>
              <th id="ledgerCached"></th>
              <th id="ledgerCacheShare"></th>
              <th id="ledgerOutput"></th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
        <p id="ledgerNote" class="note"></p>
      </section>

      <!-- The page's settings, saved to settings.json on the hub. -->
      <section id="settings" aria-label="Settings">
        <div class="page-head">
          <div>
            <h1 id="settingsHeading" class="page-title"></h1>
            <p id="settingsSub" class="page-sub"></p>
          </div>
          <span id="saveState" class="save-state" aria-live="polite"></span>
        </div>
        <div class="settings-layout">
          <nav id="settingsToc" class="settings-toc"></nav>
          <div id="settingsBody" class="settings-body"></div>
        </div>
      </section>

      <!-- The studio: layouts, widgets, mods, the
           background and the panels. studio.js draws it. -->
      <section id="studio" aria-label="Studio"></section>

      <!-- A tab a mod added. Emptied and handed to the mod each time it is
           opened. -->
      <section id="page" aria-live="off"></section>

      <!-- Which pane is on screen is decided by body[data-pane] alone, so
           there is exactly one thing to get right. `hidden` is left for
           elements that are genuinely absent rather than laid out. -->
      <section id="view" aria-label="Terminal">
        <!-- Every fact here used to take its turn in one span, and mutually
             exclusive ones overwrote each other. Now the controls own a row,
             what the agent is owns a chip, an explanation owns a row of its
             own that nothing can squeeze, and a command you have to run owns a
             button that copies it. -->
        <div id="perm" class="perm" hidden>
          <div class="perm-controls">
            <span id="permLabel" class="perm-label"></span>
            <select id="permPick" aria-label="Permission mode"></select>
            <button type="button" id="permCycle" hidden></button>
            <span id="permFlags" class="perm-flags"></span>
          </div>
          <p id="permNote" class="perm-note" hidden></p>
          <button type="button" id="permCommand" class="command" hidden>
            <svg class="glyph" aria-hidden="true"><use href="#i-copy" /></svg>
            <span class="command-text"></span>
          </button>
        </div>

        <!-- Shown when a plain session's grid had to be shrunk to fit here:
             its size belongs to the terminal that started it, so the way to
             fill this screen is to start it under --tmux. -->
        <div id="sizeNote" class="size-note" hidden>
          <span id="sizeNoteText" class="size-note-text"></span>
          <button type="button" id="sizeNoteFit" class="btn small accent"></button>
          <button type="button" id="sizeNoteCommand" class="command small">
            <svg class="glyph" aria-hidden="true"><use href="#i-copy" /></svg>
            <span class="command-text"></span>
          </button>
          <button type="button" id="sizeNoteHide" class="icon small">
            <svg class="glyph" aria-hidden="true"><use href="#i-close" /></svg>
          </button>
        </div>

        <!-- The terminal between two docks a layout can fill with widgets,
             with a strip above and below it for more. -->
        <div id="stage">
          <aside id="dockLeft" class="dock" data-side="left"></aside>
          <div id="center">
            <div id="viewTop" class="slot slot-strip"></div>
            <div id="terminal"></div>
            <div id="viewBottom" class="slot slot-strip"></div>

        <div id="keys" class="keys" role="group" aria-label="Terminal keys"></div>

        <form id="composer">
          <textarea
            id="compose"
            rows="1"
            aria-label="Prompt"
            autocapitalize="off"
            autocomplete="off"
            autocorrect="off"
            spellcheck="false"
          ></textarea>
          <button type="submit" id="send"></button>
        </form>
          </div>
          <aside id="dockRight" class="dock" data-side="right"></aside>
        </div>
      </section>

      <!-- The session's folder, read-only. A folder list over the file it
           opens: picking another row swaps the file below. -->
      <aside id="files" aria-label="Files">
        <div class="files-head">
          <button id="filesUp" class="icon small" type="button">
            <svg class="glyph" aria-hidden="true"><use href="#i-up" /></svg>
          </button>
          <nav id="crumbs" class="crumbs"></nav>
          <button id="filesHide" class="icon small" type="button">
            <svg class="glyph" aria-hidden="true"><use href="#i-close" /></svg>
          </button>
        </div>
        <ul id="tree" class="tree"></ul>
        <p id="treeNote" class="note tree-note" hidden></p>
        <div id="viewer" class="viewer">
          <div id="viewerHead" class="viewer-head" hidden>
            <svg class="glyph" aria-hidden="true"><use href="#i-file" /></svg>
            <span id="viewerName" class="viewer-name"></span>
            <span id="viewerSize" class="viewer-size"></span>
            <button id="viewerReload" class="icon small" type="button">
              <svg class="glyph" aria-hidden="true"><use href="#i-reload" /></svg>
            </button>
            <button id="viewerClose" class="icon small" type="button">
              <svg class="glyph" aria-hidden="true"><use href="#i-close" /></svg>
            </button>
          </div>
          <p id="viewerNote" class="note viewer-note" hidden></p>
          <div id="code" class="code" tabindex="0" hidden>
            <pre id="gutter" class="gutter" aria-hidden="true"></pre>
            <pre id="source" class="source"></pre>
          </div>
          <div id="viewerEmpty" class="viewer-empty">
            <svg class="glyph" aria-hidden="true"><use href="#i-file" /></svg>
            <p id="viewerEmptyText"></p>
          </div>
        </div>
      </aside>
    </main>

    <!-- Floating windows: a widget placed "floating", or a mod's own. -->
    <div id="windows"></div>

    <div id="palette" class="palette" role="dialog" aria-modal="true" hidden>
      <div class="palette-box">
        <label class="palette-search">
          <svg class="glyph" aria-hidden="true"><use href="#i-search" /></svg>
          <input id="paletteInput" type="text" autocomplete="off" spellcheck="false" role="combobox"
            aria-controls="paletteList" aria-expanded="true" />
          <kbd class="kbd">Esc</kbd>
        </label>
        <ul id="paletteList" class="palette-list" role="listbox"></ul>
      </div>
    </div>

    <div id="toast" role="status" aria-live="polite" hidden>
      <span id="toastText"></span>
      <button id="toastAction" type="button" hidden></button>
    </div>

    <script src="/assets/xterm.js"></script>
