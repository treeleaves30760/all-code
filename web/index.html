<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="referrer" content="no-referrer" />
    <meta name="color-scheme" content="light dark" />
    <title>alc</title>
    <!-- Inline, so the browser's automatic /favicon.ico request never
         happens: that route needs a token, and every page load was logging
         a 401 for it. `img-src 'self' data:` in the CSP allows this. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='5' fill='%23d98b5f'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="/assets/xterm.css" />
    <link rel="stylesheet" href="/assets/app.css" />
  </head>
  <body data-pane="list">
    <!-- One sprite for every icon on the page, referenced by <use>. Inline so
         it costs no request and no round trip against a route that needs a
         token, and drawn in `currentColor` so one set serves both themes and
         whatever state colour the thing it sits in happens to carry.

         An icon never carries a meaning on its own here: each one sits beside
         its own word, or on a control that already has an accessible name.
         The safety facts on this page are the last place to ask someone to
         learn a glyph vocabulary. -->
    <svg id="icons" aria-hidden="true" hidden>
      <symbol id="i-back" viewBox="0 0 16 16">
        <path d="M9.5 3.5 5 8l4.5 4.5" />
      </symbol>
      <symbol id="i-usage" viewBox="0 0 16 16">
        <path d="M2.4 12.2a6.4 6.4 0 1 1 11.2 0" />
        <path d="M8 9.6 10.9 6" />
      </symbol>
      <symbol id="i-copy" viewBox="0 0 16 16">
        <rect x="6" y="6" width="7.5" height="7.5" rx="1.6" />
        <path d="M10.4 3.6H4a1.6 1.6 0 0 0-1.6 1.6v6.4" />
      </symbol>
      <symbol id="i-ungated" viewBox="0 0 16 16">
        <path d="M8 1.9 13 4.1v3.7c0 3-2.1 5.4-5 6.3-2.9-.9-5-3.3-5-6.3V4.1z" />
        <path d="M5.4 10.6 10.6 5.4" />
      </symbol>
    </svg>

    <header id="bar">
      <button id="back" class="icon" type="button" hidden aria-label="Back">
        <svg class="glyph" aria-hidden="true"><use href="#i-back" /></svg>
      </button>

      <div id="title">
        <strong>alc</strong>
        <span id="subtitle"></span>
      </div>

      <!-- Connection state is a light, not a sentence. It is always on
           screen while attached, so it cannot be missed the way a toast
           that has already faded can. -->
      <span id="link" class="status" hidden>
        <span class="status-dot" aria-hidden="true"></span>
        <span id="linkLabel"></span>
      </span>
      <span id="grade" class="pill" hidden></span>

      <!-- The one thing on this page that is not about a single session, so
           it lives in the header rather than in the list. -->
      <button id="usageToggle" class="icon" type="button">
        <svg class="glyph" aria-hidden="true"><use href="#i-usage" /></svg>
      </button>
    </header>

    <main>
      <section id="list" aria-label="Sessions">
        <ul id="sessions"></ul>

        <!-- Shown only when there is nothing to list. The command is the
             whole message: there is no session because none was started. -->
        <div id="empty" class="empty" hidden>
          <span class="empty-mark" aria-hidden="true"></span>
          <p id="emptyTitle" class="empty-title"></p>
          <p id="emptyHow" class="empty-how"></p>
          <button type="button" id="emptyCommand" class="command">
            <svg class="glyph" aria-hidden="true"><use href="#i-copy" /></svg>
            <span class="command-text"></span>
          </button>
        </div>
      </section>

      <!-- What is left on each login, and where it went. Read-only: this
           page can spend a quota but never change one. -->
      <section id="usage" aria-label="Usage">
        <h2 id="accountsTitle" class="pane-title"></h2>
        <ul id="accounts"></ul>
        <p id="usageNote" class="note" hidden></p>

        <div id="usageEmpty" class="empty" hidden>
          <span class="empty-mark" aria-hidden="true"></span>
          <p id="usageEmptyTitle" class="empty-title"></p>
          <p id="usageEmptyHow" class="empty-how"></p>
          <button type="button" id="usageEmptyCommand" class="command">
            <svg class="glyph" aria-hidden="true"><use href="#i-copy" /></svg>
            <span class="command-text"></span>
          </button>
        </div>

        <h2 id="ledgerTitle" class="pane-title"></h2>
        <table id="ledger" class="ledger">
          <thead>
            <tr>
              <th id="ledgerProvider"></th>
              <th id="ledgerAgent"></th>
              <th id="ledgerLaunches"></th>
              <th id="ledgerTurns"></th>
              <th id="ledgerTokens"></th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
        <p id="ledgerNote" class="note"></p>
      </section>

      <!-- Which pane is on screen is decided by body[data-pane] alone, so
           there is exactly one thing to get right. `hidden` is left for
           elements that are genuinely absent rather than laid out. -->
      <section id="view" aria-label="Terminal">
        <!-- Every fact here used to take its turn in one span, and mutually
             exclusive ones overwrote each other. Now the controls own a row,
             what the agent is owns a chip, an explanation owns a row of its
             own that nothing can squeeze, and a command you have to run owns a
             button that copies it. -->
        <div id="perm" class="perm" hidden>
          <div class="perm-controls">
            <span id="permLabel" class="perm-label"></span>
            <select id="permPick" aria-label="Permission mode"></select>
            <button type="button" id="permCycle" hidden></button>
            <span id="permFlags" class="perm-flags"></span>
          </div>
          <p id="permNote" class="perm-note" hidden></p>
          <button type="button" id="permCommand" class="command" hidden>
            <svg class="glyph" aria-hidden="true"><use href="#i-copy" /></svg>
            <span class="command-text"></span>
          </button>
        </div>

        <div id="terminal"></div>

        <div id="keys" class="keys" role="group" aria-label="Terminal keys"></div>

        <form id="composer">
          <textarea
            id="compose"
            rows="1"
            aria-label="Prompt"
            autocapitalize="off"
            autocomplete="off"
            autocorrect="off"
            spellcheck="false"
          ></textarea>
          <button type="submit" id="send"></button>
        </form>
      </section>
    </main>

    <div id="toast" role="status" aria-live="polite" hidden></div>

    <script src="/assets/xterm.js"></script>
    <script src="/assets/addon-fit.js"></script>
    <script src="/assets/core.js"></script>
    <script src="/assets/app.js"></script>
  </body>
</html>
